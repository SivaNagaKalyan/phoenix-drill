name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          pip install --quiet yamllint==1.35.1 ruff==0.6.8
          bash tools/install-tools.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Shell scripts
        run: shellcheck tools/*.sh scripts/*.sh
      - name: YAML
        run: yamllint --strict .
      - name: Python
        working-directory: app
        run: ruff check . && ruff format --check .
      - name: Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < app/Dockerfile
      - name: Kubernetes manifests
        run: |
          source tools/versions.env
          for dir in deploy/data deploy/app; do
            kubectl kustomize "${dir}" | kubeconform -strict -summary -kubernetes-version "${KUBECTL_VERSION#v}" -
          done
          kubeconform -strict -summary -kubernetes-version "${KUBECTL_VERSION#v}" deploy/jobs/
      - name: No em dashes anywhere
        run: |
          if grep -rnI $'\u2014' --exclude-dir=.git .; then
            echo "::error::em dash found, see lines above"; exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Unit and integration tests
        working-directory: app
        env:
          TEST_DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger
        run: pytest -q

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.0
      - name: Build
        run: docker build -t "ledger:${GITHUB_SHA}" app
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ledger:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
