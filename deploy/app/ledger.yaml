apiVersion: v1
kind: Service
metadata:
  name: ledger
  labels: {app.kubernetes.io/name: ledger, app.kubernetes.io/part-of: phoenix}
spec:
  selector: {app.kubernetes.io/name: ledger}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  labels: {app.kubernetes.io/name: ledger, app.kubernetes.io/part-of: phoenix}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: ledger}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/part-of: phoenix
        phoenix/db-client: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ledger}
      containers:
        - name: ledger
          image: ledger
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PGHOST, value: postgres}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: database}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give endpoints time to drop this pod before it stops accepting connections.
            preStop:
              exec: {command: ["python", "-c", "import time; time.sleep(5)"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger
  labels: {app.kubernetes.io/name: ledger, app.kubernetes.io/part-of: phoenix}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ledger}
