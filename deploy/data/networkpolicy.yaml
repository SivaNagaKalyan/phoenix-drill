# Default deny all ingress in the namespace, then open only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-clients
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {phoenix/db-client: "true"}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-allow-http
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ledger}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
